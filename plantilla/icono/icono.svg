<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Icono a sangre: sin esquinas redondeadas (iOS aplica su máscara). Zona segura: círculo central de ~800 px. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="__ACENTO_OSCURO__"/>
      <stop offset="1" stop-color="__ACENTO_CLARO__"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <rect width="1024" height="1024" fill="url(#brillo)"/>
  <g filter="url(#sombra)">
    <rect x="262" y="242" width="500" height="560" rx="64" fill="#ffffff"/>
    <path d="M352 420 l60 60 l110 -120" fill="none" stroke="__ACENTO_CLARO__" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="352" y="560" width="320" height="36" rx="18" fill="__ACENTO_CLARO__" opacity=".35"/>
    <rect x="352" y="640" width="220" height="36" rx="18" fill="__ACENTO_CLARO__" opacity=".22"/>
  </g>
</svg>
